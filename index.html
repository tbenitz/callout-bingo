lor:var(--muted);margin-top:12px}.tutorial{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tutorial .num{color:var(--mint);font-size:27px;font-weight:1000}.tutorial h3{margin:6px 0}.tutorial p{margin-bottom:0}.divider{height:1px;background:var(--border);margin:22px 0}.footer{padding:28px 0;color:#718da5;font-size:12px;line-height:1.6;text-align:center}.toast-area{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;display:grid;gap:8px;width:min(420px,92vw);pointer-events:none}.toast{background:#273d50;border:1px solid #587187;padding:13px 16px;border-radius:11px;box-shadow:var(--shadow);font-weight:700;font-size:13px;text-align:center;animation:toastIn .2s ease-out}@keyframes toastIn{from{transform:translateY(15px);opacity:0}to{opacity:1;transform:none}}.voice-indicator{background:#3e3243;color:#ffe2ea;padding:13px 15px;border-radius:12px;border:1px solid #985c6e;font-weight:800;display:flex;gap:8px;align-items:center}.voice-indicator.active{animation:readyPulse 1.5s infinite}.badge-live{color:#9bffd9;font-weight:850}.hidden{display:none!important}.confetti{position:fixed;top:-25px;width:8px;height:18px;z-index:120;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(730deg)}}

/* V3: single-screen, no-scroll gameplay shell */
body.in-game{height:100dvh;min-height:0;overflow:hidden;overscroll-behavior:none}
body.in-game .wrap{max-width:none;width:100%;height:100dvh;min-height:0;display:flex;flex-direction:column;padding:10px clamp(9px,1.5vw,23px) max(9px,env(safe-area-inset-bottom));overflow:hidden}

body.in-game .topright{gap:7px;flex-wrap:nowrap}

body.in-game .topright .btn-small{padding:8px 10px;font-size:11px}

.game-title button{font-size:12px;padding:8px 12px;border-radius:9px}

/* V4 — every app destination is one viewport, not a scrolling document */
html,body{height:100%;overscroll-behavior:none}
body.app-mode{height:100dvh;min-height:0;overflow:hidden}
body.app-mode .wrap{max-width:1270px;width:100%;height:100dvh;min-height:0;display:flex;flex-direction:column;padding:clamp(6px,1.4vh,15px) clamp(8px,2vw,21px) max(7px,env(safe-area-inset-bottom));overflow:hidden}
body.app-mode main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
body.app-mode .top{flex:none;flex-wrap:nowrap;height:clamp(34px,6.3vh,49px);margin:0 0 clamp(4px,1.3vh,11px);gap:5px}

body.app-mode .topright{flex-wrap:nowrap;gap:6px}

.app-screen{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column;overflow:hidden;gap:clamp(7px,1.25vh,12px)}
.app-screen .pane{padding:14px}

.app-screen .field{margin:0;gap:5px;min-width:0}

.screen-heading .chip{white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}
.screen-actions{display:grid;grid-template-columns:minmax(88px,.55fr) minmax(150px,1.45fr);gap:8px;flex:none;margin-top:auto;min-height:clamp(43px,7vh,52px)}

.home-foot{display:flex;justify-content:center;gap:clamp(8px,2vw,25px);flex-wrap:wrap;color:#91b6c5;font-size:clamp(10px,1.4vw,13px);font-weight:750}
/* Setup */
.config-tabs{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:#0f2336;padding:4px;border:1px solid #2e4c60;border-radius:12px}

check field-span"><input id="free" type="checkbox" ${v.free?'checked':''}> FREE center square</label><div class="field field-span"><label for="markModeSetup">Card marking</label><select id="markModeSetup">${markModeOptions(S.markMode,isObserve({...v,flow:flowFor(v)}))}</select></div></div><div class="config-tip">Classic: mark numbers after a call. Party/Movie: tap events when they happen — no caller.</div></div><div class="config-panel tab-options"><div class="section-micro">HOW THE ROUND RUNS</div><div class="config-tip">Classic draws numbers manually or on a timed range. Set caller timing, voice and sound in ⚙ Settings. Party and Movie never auto-call.</div><div class="config-fields">${solo?`<div class="field"><label for="bots">Computer opponents</label><select id="bots"><option value="1" ${v.botCount===1?'selected':''}>1 CPU</option><option value="2" ${v.botCount===2?'selected':''}>2 CPUs</option><option value="3" ${v.botCount===3?'selected':''}>3 CPUs</option></select></div><div class="field field-span"><label for="difficulty">Computer difficulty</label><select id="difficulty"><option value="easy" ${v.botDifficulty==='easy'?'selected':''}>Easy — misses some calls</option><option value="normal" ${v.botDifficulty==='normal'?'selected':''}>Normal — occasional misses</option><option value="hard" ${v.botDifficulty==='hard'?'selected':''}>Hard — marks everything</option></select></div>`:`<label class="check field-span"><input id="hostPlayer" type="checkbox" ${v.hostPlayer?'checked':''}> Give the host a playable card too</label>`}</div><div class="config-tip">${solo?'CPU opponents receive their own randomized cards and compete for one point each round.':'For a TV-only caller, leave “host card” unchecked. Friends join using a code or QR.'}</div></div><div class="config-panel tab-calls" id="presetEditor"><div class="field"><label for="preset">Preset call list</label><select id="preset"><option value="classic" ${v.preset==='classic'?'selected':''}>🔢 Classic (1–75)</option><option value="party" ${v.preset==='party'?'selected':''}>🎉 Party Bingo</option><option value="movies" ${v.preset==='movies'?'selected':''}>🍿 Movie-night Bingo</option><option value="office" ${v.preset==='office'?'selected':''}>💼 Office Bingo</option><option value="custom" ${v.preset==='custom'?'selected':''}>✍️ My custom list</option></select></div><div class="field" id="customFlowField" style="display:${v.preset==='custom'?'flex':'none'}"><label for="customFlow">Custom list game style</label><select id="customFlow"><option value="observe" ${v.customFlow!=='caller'?'selected':''}>Spotting — mark real events</option><option value="caller" ${v.customFlow==='caller'?'selected':''}>Random caller — draw prompts</option></select></div><div class="call-editor"><label for="callList">Prompts (one per line) · <span id="callCount">${parseCalls(v.calls).length}</span> unique</label><textarea id="callList" spellcheck="false">${esc(v.calls)}</textarea></div><div class="call-tools"><button class="btn-small btn-outline" data-action="shuffleList">Shuffle</button><button class="btn-small btn-outline" data-action="clearList">Clear</button><button class="btn-small btn-outline" data-action="exportCalls">Export</button><button class="btn-small btn-outline" data-action="importCalls">Import .txt</button><input id="importFile" type="file" accept=".txt,text/plain" class="hidden"></div><div class="config-tip">Party, Movie and Office are watch-and-mark games. Custom lists can be either watch-and-mark or random caller. The app cannot automatically detect real events.</div></div><div class="screen-actions"><button class="btn-outline" data-action="leave">← Home</button><button class="btn-primary" data-action="${solo?'createSolo':'createHost'}">${solo?'Start solo game':'Create room'} →</button></div></div>`}

function field(label,id,val,type='text'){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" maxlength="22" autocomplete="nickname" value="${esc(val)}"></div>`}
function parseCalls(txt){const seen=new Set();return String(txt).split(/\r?\n|\|/).map(x=>x.trim().slice(0,105)).filter(x=>{const k=x.toLocaleLowerCase();if(!x||seen.has(k))return false;seen.add(k);return true})}
function collectSetup(){const v=S.setup;v.size=Number($('#size')?.value)||5;v.free=!!$('#free')?.checked;v.preset=$('#preset')?.value||v.preset;v.calls=$('#callList')?.value||'';v.hostPlayer=!!$('#hostPlayer')?.checked;v.botCount=Number($('#bots')?.value)||1;v.botDifficulty=$('#difficulty')?.value||'normal';v.customFlow=$('#customFlow')?.value||v.customFlow||'observe';v.flow=flowFor(v);setMarkMode($('#markModeSetup')?.value||S.markMode,false);v.markMode=S.markMode;saveNick($('#soloName')?.value||'Player')}
function joinView(){return `<div class="app-screen join-screen"><div class="screen-heading"><div><div class="eyebrow">JOIN FRIENDS</div><h1>Get your bingo card</h1></div><span class="chip good">📱 Phone ready</span></div><div class="join-center"><div class="join-symbol">📱</div><p class="join-prompt">Ask the host for their 6-character code.</p><div class="field"><label for="joinName">Your nickname</label><input id="joinName" maxlength="22" autocomplete="nickname" value="${esc(S.nick||'Player')}"></div><div class="field"><label for="joinCode">Room code</label><input id="joinCode" class="join-code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC123" maxlength="8" value="${esc(S.autoJoin)}"></div><button class="btn-primary join-submit" data-action="join">Join game →</button><div class="join-note">🎙️ Winning players may shout BINGO for 10 seconds, with mic permission.</div></div><div class="join-foot">No account needed · Each player receives a private card</div></div>`}

function Hplayer(id,name,kind,conn=null){return {id,name,kind,conn,card:[],marked:new Set(),score:0,connected:true,ready:false,claimed:false,markMode:kind==='bot'?'auto':S.markMode}}
function createH(role){const v=structuredClone(S.setup);v.flow=flowFor(v);if(v.readAloud){window.CalloutVoice?.setEnabled(true);window.CalloutVoice?.prepare().catch(()=>toast('Voice unavailable; game still works.'))}if(isObserve(v))v.seconds=0;const prompts=parseCalls(v.calls);const needed=v.size*v.size-(v.free&&v.size%2?1:0);if(prompts.length<needed){showError(`Add at least ${needed} unique calls for a ${v.size}×${v.size} card.`);return false}S.role=role;S.status=role==='solo'?'Offline solo':'Connecting';S.H={room:uid().slice(0,6),cfg:v,prompts,phase:'lobby',round:0,deck:[],called:[],winner:null,players:new Map(),autoActive:!isObserve(v)&&!!v.seconds,voiceId:null,voiceToken:null,voiceStarted:false};if(role==='solo'){S.H.players.set('local',Hplayer('local',S.nick||'You','local'));for(let i=1;i<=v.botCount;i++)S.H.players.set('cpu'+i,Hplayer('cpu'+i,i===1?'Bingo Bot':i===2?'Lucky CPU':'Card Shark','bot'));S.status='Connected';beginRound();S.page='game';render();return true}if(v.hostPlayer)S.H.players.set('local',Hplayer('local',S.nick||'Host','local'));S.page='lobby';render();return true}
function makeCard(list,cfg){const n=cfg.size;const free=cfg.free&&n%2===1,mid=(n*n-1)/2;let a=[];if(cfg.preset==='classic'&&n===5&&list.length===75){for(let col=0;col<5;col++){const group=list.filter(v=>v.startsWith('BINGO'[col])&&Number(v.slice(1))>=(col*15+1)&&Number(v.slice(1))<=(col+1)*15);const chosen=shuffle(group).slice(0,5);for(let row=0;row<5;row++)a[row*5+col]=chosen[row]}}else{a=shuffle(list).slice(0,n*n-(free?1:0))}if(free){if(cfg.preset==='classic'&&n===5)a[mid]='FREE';else a.splice(mid,0,'FREE')}return a}
function beginRound(){window.CalloutVoice?.stop();const h=S.H;if(!h)return;stopAuto(false);h.autoActive=!isObserve(h.cfg)&&!!h.cfg.seconds;stopSpeaking();h.round++;h.phase='playing';h.winner=null;h.winningLine=[];h.called=[];h.deck=isObserve(h.cfg)?[]:shuffle(h.prompts);h.voiceStarted=false;h.voiceId=null;h.voiceToken=null;S.voiceGate=null;S.voiceUsed=false;S.autoDue=0;for(const p of h.players.values()){p.card=makeCard(h.prompts,h.cfg);p.marked=new Set(p.card.includes('FREE')?['FREE']:[]);p.claimed=false;if(p.conn&&p.conn.open)send(p.conn,{type:'card',card:p.card,marks:[...p.marked],round:h.round})}broadcastState();render();if(h.autoActive)startAuto()}
function newHroom(){collectSetup();if(!createH('host'))return;if(typeof Peer==='undefined'){S.H=null;S.role='';S.page='setupHost';render();showError('PeerJS could not load. Connect to the internet, then try again. Solo mode works offline.');return}openHostPeer()}
function openHostPeer(attempt=0){const h=S.H;let id='callout-'+h.room.toLowerCase();let p;try{p=new Peer(id,{debug:0})}catch(e){showError('Could not open a P2P session: '+e.message);return}S.peer=p;p.on('open',()=>{S.status='Connected';render();toast('Room is live! Share '+h.room)});p.on('connection',conn=>incomingHostConn(conn));p.on('call',call=>receiveCall(call));p.on('error',e=>{if(e.type==='unavailable-id'&&attempt<3){try{p.destroy()}catch{}h.room=uid().slice(0,6);openHostPeer(attempt+1)}else{S.status='Connection trouble';render();showError(e.message||'PeerServer connection failed')}});p.on('disconnected',()=>{S.status='Reconnecting';render();try{p.reconnect()}catch{}});p.on('close',()=>{S.status='Disconnected';render()})}
function incomingHostConn(conn){
 if(!S.H){conn.close();return}const h=S.H;
 conn.on('open',()=>{conn.send({type:'helloHost'});setTimeout(()=>{if(!h.players.has(conn.peer)&&conn.open)conn.close()},12000)});
 conn.on('data',d=>{
  if(!d||typeof d!=='object')return;let p=h.players.get(conn.peer);
  if(d.type==='join'){
   const nick=String(d.name||'Guest').trim().slice(0,22)||'Guest';
   let old=[...h.players.values()].find(x=>x.kind==='remote'&&x.name.toLowerCase()===nick.toLowerCase()&&!x.connected);
   if(old){h.players.delete(old.id);p=old;p.id=conn.peer;p.conn=conn;p.connected=true;h.players.set(p.id,p)}
   else if(!p){p=Hplayer(conn.peer,nick,'remote',conn);h.players.set(p.id,p);if(h.phase!=='lobby'){p.card=makeCard(h.prompts,h.cfg);p.marked=new Set(p.card.includes('FREE')?['FREE']:[])}}
   else{p.name=nick;p.connected=true;p.conn=conn}
   p.markMode=safeMarkMode(d.mode);if(p.markMode==='auto'&&h.phase==='playing')p.marked=isObserve(h.cfg)?new Set([...p.marked,...autoMarks(p.card,h.called)]):autoMarks(p.card,h.called);
   S.conns.set(conn.peer,conn);
   send(conn,{type:'welcome',playerId:p.id,room:h.room,card:p.card,marks:[...p.marked],round:h.round,config:{size:h.cfg.size,free:h.cfg.free,preset:h.cfg.preset,flow:h.cfg.flow,prompts:h.prompts}});
   sendState(conn);broadcastState();render();toast(nick+' joined the room');
   if(h.phase==='playing'&&p.markMode==='auto'&&validWin(p.card,p.marked,h.cfg.size,winPool(h.cfg,h.called)))claimWin(p);
   return;
  }
  if(!p||p.conn!==conn||!p.connected)return;
  if(d.type==='mark'){
   const label=String(d.label||'');const obs=isObserve(h.cfg);
   if(p.card.includes(label)&&label!=='FREE'&&h.phase==='playing'&&d.round===h.round&&
      (obs||(p.markMode!=='auto'&&(p.markMode==='manual'||h.called.includes(label))))){
    const wasMarked=p.marked.has(label);
    if(wasMarked){if(!(obs&&p.markMode==='auto'))p.marked.delete(label)}else p.marked.add(label);
    if(obs&&!wasMarked)registerSighting(h,label);
    if(p.conn)send(p.conn,{type:'marks',marks:[...p.marked],round:h.round});
    if(h.phase==='playing'&&p.markMode==='auto'&&validWin(p.card,p.marked,h.cfg.size,winPool(h.cfg,h.called))){claimWin(p);return}
    broadcastState();render();
   }
  }else if(d.type==='setMode'){
   p.markMode=safeMarkMode(d.mode);
   if(p.markMode==='auto'&&h.phase==='playing')p.marked=isObserve(h.cfg)?new Set([...p.marked,...autoMarks(p.card,h.called)]):autoMarks(p.card,h.called);
   else if(p.markMode==='highlight'&&!isObserve(h.cfg))p.marked=eligibleMarks(p.marked,h.called);
   send(conn,{type:'marks',marks:[...p.marked],round:h.round});broadcastState();
   if(p.markMode==='auto'&&h.phase==='playing'&&validWin(p.card,p.marked,h.cfg.size,winPool(h.cfg,h.called)))claimWin(p);
  }else if(d.type==='sighting'){if(isObserve(h.cfg)&&h.phase==='playing'&&d.round===h.round){registerSighting(h,String(d.label||''));broadcastState();render()}}else if(d.type==='claim'){if(d.round===h.round)claimWin(p)}
  else if(d.type==='voiceRequest'){if(h.winner===p.id&&h.phase==='finished'&&!h.voiceStarted)issueVoicePermission(p)}
  else if(d.type==='ping')send(conn,{type:'pong'});
 });
 conn.on('close',()=>{const p=h.players.get(conn.peer);if(p&&p.conn===conn){p.connected=false;p.conn=null}S.conns.delete(conn.peer);broadcastState();render();toast((p?.name||'A player')+' disconnected')});conn.on('error',()=>{});
}
function send(c,msg){if(c&&c.open)try{c.send(msg)}catch(e){console.warn('send',e)}}
function snapshot(){const h=S.H;return {type:'state',round:h.round,phase:h.phase,called:h.called,current:h.called.at(-1)||null,total:h.prompts.length,winner:h.winner,autoActive:h.autoActive,seconds:h.cfg.seconds,players:[...h.players.values()].map(p=>({id:p.id,name:p.name,kind:p.kind,score:p.score,connected:p.connected,markedCount:p.marked.size,progress:p.markMode==='manual'?0:maxProgress(p.card,p.marked,h.cfg.size,winPool(h.cfg,h.called))}))}}
function sendState(c){send(c,snapshot())}
function broadcastState(){if(!S.H)return;const snap=snapshot();for(const conn of S.conns.values())send(conn,snap)}
function startGuest(){saveNick($('#joinName')?.value||'Player');const code=($('#joinCode')?.value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length!==6){showError('Enter a 6-character room code.');return}if(typeof Peer==='undefined'){showError('PeerJS did not load. Check the internet connection.');return}closeNetwork(false);S.role='guest';S.status='Connecting';S.C={room:code,playerId:'',card:[],marked:new Set(),cfg:{size:5,free:true,preset:'classic',flow:'caller'},round:0,phase:'lobby',called:[],current:null,total:0,winner:null,players:[],autoActive:false,seconds:0};S.page='game';render();const p=new Peer(undefined,{debug:0});S.peer=p;p.on('open',()=>{const conn=p.connect('callout-'+code.toLowerCase(),{reliable:true,serialization:'json'});S.conn=conn;conn.on('open',()=>{S.status='Connected';send(conn,{type:'join',name:S.nick,mode:S.markMode});render()});conn.on('data',guestData);conn.on('close',()=>{S.status='Disconnected';render();showError('Lost connection to the host. Return to Join to reconnect.')});conn.on('error',e=>{S.status='Connection failed';render();showError(e.message||'Could not reach room')});setTimeout(()=>{if(S.conn===conn&&!conn.open){S.status='Room not found';render();showError('Could not find this room. Check the code and whether the TV host is still open.')}},12500)});p.on('call',receiveCall);p.on('error',e=>{S.status='Connection problem';render();showError(e.message||'Peer server error')});p.on('disconnected',()=>{S.status='Reconnecting';render();try{p.reconnect()}catch{}})}
function guestData(d){if(!d||typeof d!=='object'||!S.C)return;const c=S.C;if(d.type==='welcome'){c.playerId=d.playerId;c.card=d.card||[];c.marked=new Set(d.marks||[]);c.cfg=d.config||c.cfg;c.round=d.round||0;render();toast('You joined room '+c.room)}else if(d.type==='state'){const old=c.current;c.round=d.round;c.phase=d.phase;c.called=d.called||[];c.current=d.current;c.total=d.total;c.winner=d.winner;c.players=d.players||[];c.autoActive=d.autoActive;c.seconds=d.seconds;if(S.markMode==='auto'&&c.card.length&&c.phase==='playing')c.marked=isObserve(c.cfg)?new Set([...c.marked,...autoMarks(c.card,c.called)]):autoMarks(c.card,c.called);if(old!==c.current&&c.current)beep();render()}else if(d.type==='card'){c.card=d.card||[];c.marked=new Set(d.marks||[]);c.round=d.round;c.called=[];c.current=null;c.winner=null;c.phase='playing';if(S.markMode==='auto')c.marked=autoMarks(c.card,c.called);S.voiceUsed=false;S.voiceGate=null;render();toast('New round — new card!')}else if(d.type==='marks'){if(d.round===undefined||d.round===c.round){c.marked=new Set(d.marks||[]);if(S.markMode==='auto'&&c.phase==='playing')c.marked=isObserve(c.cfg)?new Set([...c.marked,...autoMarks(c.card,c.called)]):autoMarks(c.card,c.called);render()}}else if(d.type==='claimResult'){if(!d.ok)showError(d.reason||'Not a bingo yet!');else{celebrate();toast('BINGO VERIFIED! You won this round!')}}else if(d.type==='voiceNotice'){S.voiceGate={token:d.token,speakerPeer:d.peer,until:Date.now()+15000};toast(d.name+' is about to shout BINGO 🎙️')}else if(d.type==='voiceGo'){launchVoice(d.peers||[],d.token,d.ms||10000)}else if(d.type==='voiceEnd'){S.voiceGate=null;stopRemoteAudio()}else if(d.type==='hostMessage')toast(d.text||'Host update')}

function calloutSay(text){if(S.H?.cfg?.readAloud)window.CalloutVoice?.announce(text)}
function spokenNumber(n){
 const ones=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
 const tens=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
 return n<20?ones[n]:tens[Math.floor(n/10)]+(n%10?' '+ones[n%10]:'');
}
function spokenCaller(value){
 const m=/^([BINGO])(\d{1,2})$/.exec(String(value));
 if(!m||Number(m[2])<1||Number(m[2])>75)return 'Next call: '+value;
 const letters={B:'Bee',I:'Eye',N:'En',G:'Gee',O:'Oh'};
 return letters[m[1]]+', number '+spokenNumber(Number(m[2]))+'.';
}
function voiceInfo(){return window.CalloutVoice?.status()||{state:'idle',message:'Voice module loading…',voice:'M1',voices:{M1:'Aiden',M2:'Hiro',M3:'Leo',F1:'Mina',F2:'Sora',F3:'Yuna'}}}
function voicePanel(){const v=voiceInfo(),enabled=S.H?!!S.H.cfg.readAloud:!!S.setup.readAloud;return `<div class="settings-voice"><div class="setting-row"><b>🗣️ Supertonic voice caller</b><button class="btn-outline btn-small" data-action="toggleVoice">${enabled?'🔊 On — tap to mute':'🔇 Off — tap to enable'}</button></div><div class="setting-status" id="supertonicStatus" role="status">${esc(v.message)}</div><div class="voice-controls"><label for="supertonicVoice" class="sr-only">Voice style</label><select id="supertonicVoice">${Object.entries(v.voices).map(([id,name])=>`<option value="${id}" ${v.voice===id?'selected':''}>${esc(name)} (${id})</option>`).join('')}</select><button class="btn-blue btn-small" data-action="testVoice">▶ Test</button><button class="btn-outline btn-small" data-action="lastVoice" ${!S.H?.called?.length?'disabled':''}>↻ Repeat</button></div><p class="small-muted">On-device voice · First use downloads Supertonic (~400 MB). Tap Test to hear it.</p></div>`}
function settingsPanel(){
 const cfg=S.H?.cfg||S.setup,obs=isObserve(cfg)||cfg.preset!=='classic'&&cfg.preset!=='custom';
 const canControl=!!S.H||S.page==='setupSolo'||S.page==='setupHost'||S.page==='home';
 const timerAllowed=canControl&&!obs;
 const auto=!!cfg.seconds;
 return `<div class="settings-content"><section class="setting-section"><div class="setting-row"><b>🔔 Game sound effects</b><label class="settings-switch"><input id="soundSetting" type="checkbox" ${S.soundOn?'checked':''}> ${S.soundOn?'On':'Off'}</label></div><p class="small-muted">Controls game beeps. Your winner microphone and Supertonic voice are separate.</p></section>${canControl?`<section class="setting-section">${voicePanel()}</section>`:`<section class="setting-section"><b>🗣️ Voice caller</b><p class="small-muted">Supertonic is controlled by the host and plays there. Your phone can receive winner shouts.</p></section>`}${timerAllowed?`<section class="setting-section"><div class="setting-row"><b>⏱️ Timed caller</b><label class="settings-switch"><input type="checkbox" id="autoCallerSetting" ${auto?'checked':''}> ${auto?'On':'Off'}</label></div><div class="setting-time-range"><label>Minimum seconds<input type="number" id="autoMin" min="3" max="180" step="1" value="${Number(cfg.minSeconds)||10}" inputmode="numeric"></label><span>to</span><label>Maximum seconds<input type="number" id="autoMax" min="3" max="180" step="1" value="${Number(cfg.maxSeconds)||20}" inputmode="numeric"></label></div><p class="small-muted">Each next call waits a random time in this range. Pause or draw manually at any time.</p></section>`:''}</div>`;
}
function drawNext(manual=true){const h=S.H;if(!h||h.phase!=='playing'||isObserve(h.cfg))return;
 if(!h.deck.length){h.phase='finished';h.winner=null;stopAuto(false);broadcastState();render();toast('All calls have been drawn. Start a new round.');return}
 const value=h.deck.pop();h.called.push(value);
 calloutSay(spokenCaller(value))
 for(const p of h.players.values()){
  if(p.kind==='bot'&&p.card.includes(value)){const prob=h.cfg.botDifficulty==='easy'?.72:h.cfg.botDifficulty==='normal'?.91:1;if(Math.random()<prob)p.marked.add(value)}
  else if(p.kind!=='bot'&&p.markMode==='auto'&&p.card.includes(value)){p.marked.add(value);if(p.conn)send(p.conn,{type:'marks',marks:[...p.marked],round:h.round})}
 }
 const automatic=[...h.players.values()].filter(p=>p.kind!=='bot'&&p.markMode==='auto'&&validWin(p.card,p.marked,h.cfg.size,h.called));
 if(automatic.length){claimWin(automatic[0]);return}
 broadcastState();render();
 if(manual&&h.autoActive)scheduleAuto(h);
 const bots=[...h.players.values()].filter(p=>p.kind==='bot'&&validWin(p.card,p.marked,h.cfg.size,h.called));
 if(bots.length){const winner=shuffle(bots)[0];setTimeout(()=>{if(S.H===h&&h.phase==='playing'&&validWin(winner.card,winner.marked,h.cfg.size,h.called))claimWin(winner)},1400+Math.random()*1100)}
 if(!h.deck.length&&!bots.length)toast('Final call drawn! Mark your card and press BINGO, or start a new round.');
}
function registerSighting(h,label){
 if(!isObserve(h.cfg)||h.phase!=='playing'||!h.prompts.includes(label))return;
 if(h.called.includes(label))return;
 h.called.push(label);
 calloutSay('Spotted: '+label);
 for(const p of h.players.values()){
  if(!p.card.includes(label))continue;
  if(p.kind==='bot'){
   const chance=h.cfg.botDifficulty==='easy'?.55:h.cfg.botDifficulty==='normal'?.78:.97;
   if(Math.random()<chance)p.marked.add(label);
  }else if(p.markMode==='auto'){
   p.marked.add(label);if(p.conn)send(p.conn,{type:'marks',marks:[...p.marked],round:h.round});
  }
 }
 const human=[...h.players.values()].find(p=>p.kind!=='bot'&&p.markMode==='auto'&&validWin(p.card,p.marked,h.cfg.size,null));
 if(human){claimWin(human);return}
 const bot=[...h.players.values()].find(p=>p.kind==='bot'&&validWin(p.card,p.marked,h.cfg.size,null));
 if(bot){setTimeout(()=>{if(S.H===h&&h.phase==='playing'&&validWin(bot.card,bot.marked,h.cfg.size,null))claimWin(bot)},1600)}
}
function safeMarkMode(mode){return ['manual','highlight','auto'].includes(mode)?mode:'highlight'}
function markModeOptions(current,obs=false){return (obs?[
 ['manual','✋ Manual — mark what you witness'],['highlight','💡 Highlight shared sightings — you tap'],['auto','⚡ Auto-mark events other players report']
 ]:[['manual','✋ Manual — no hints, mark any square'],['highlight','💡 Highlight called matches — you tap'],['auto','⚡ Automatic — mark matches and call BINGO']]).map(([k,label])=>`<option value="${k}" ${current===k?'selected':''}>${label}</option>`).join('')}
function autoMarks(card,called){const allowed=new Set(called);return new Set((card||[]).filter(v=>v==='FREE'||allowed.has(v)))}
function eligibleMarks(marks,called){const allowed=new Set(called);allowed.add('FREE');return new Set([...marks].filter(x=>allowed.has(x)))}
function winningLine(card,marks,n,called){if(!card||card.length!==n*n)return [];const eligible=called==null?marks:eligibleMarks(marks,called);const lines=[];for(let r=0;r<n;r++)lines.push(Array.from({length:n},(_,c)=>r*n+c));for(let c=0;c<n;c++)lines.push(Array.from({length:n},(_,r)=>r*n+c));lines.push(Array.from({length:n},(_,i)=>i*n+i));lines.push(Array.from({length:n},(_,i)=>i*n+(n-1-i)));return lines.find(indices=>indices.every(i=>eligible.has(card[i])))||[]}
function setMarkMode(mode,update=true){mode=safeMarkMode(mode);S.markMode=mode;S.setup.markMode=mode;try{localStorage.setItem('callout_mark_mode',mode)}catch{}if(!update)return;
 if(S.role==='guest'&&S.C){const c=S.C;if(mode==='auto'&&c.card.length)c.marked=new Set([...c.marked,...autoMarks(c.card,c.called)]);else if(mode==='highlight'&&!isObserve(c.cfg))c.marked=eligibleMarks(c.marked,c.called);send(S.conn,{type:'setMode',mode});render()}
 else if(S.H){const h=S.H,p=h.players.get('local');if(p){p.markMode=mode;if(mode==='highlight'&&!isObserve(h.cfg))p.marked=eligibleMarks(p.marked,h.called);if(mode==='auto'){p.marked=isObserve(h.cfg)?new Set([...p.marked,...autoMarks(p.card,h.called)]):autoMarks(p.card,h.called);if(h.phase==='playing'&&validWin(p.card,p.marked,h.cfg.size,winPool(h.cfg,h.called))){claimWin(p);return}}broadcastState();render()}}
}
function maxProgress(card,marks,n,called){if(!card?.length||!n)return 0;const eligible=called?eligibleMarks(marks,called):marks;let max=0;for(let r=0;r<n;r++){let v=0;for(let c=0;c<n;c++)if(eligible.has(card[r*n+c]))v++;max=Math.max(max,v)}for(let c=0;c<n;c++){let v=0;for(let r=0;r<n;r++)if(eligible.has(card[r*n+c]))v++;max=Math.max(max,v)}let a=0,b=0;for(let i=0;i<n;i++){if(eligible.has(card[i*n+i]))a++;if(eligible.has(card[i*n+(n-1-i)]))b++}return Math.max(max,a,b)}
function validWin(card,marks,n,called){return winningLine(card,marks,n,called).length===n}
function claimWin(p){const h=S.H;if(!h||h.phase!=='playing'){if(p.conn)send(p.conn,{type:'claimResult',ok:false,reason:'This round is already over.'});return}
 const obs=isObserve(h.cfg);const line=winningLine(p.card,p.marked,h.cfg.size,winPool(h.cfg,h.called));
 if(!line.length){const reason=obs?'No full line marked yet. Check one row, column or diagonal of events you witnessed.':'No verified line yet. Only actually called squares count toward BINGO.';if(p.conn)send(p.conn,{type:'claimResult',ok:false,reason});else toast(reason);return}
 h.winner=p.id;h.winningLine=line;h.phase='finished';p.score=(Number(p.score)||0)+1;stopAuto(false);h.autoActive=false;broadcastState();if(p.conn)send(p.conn,{type:'claimResult',ok:true});render();beep();celebrate();toast('🏆 '+p.name+' wins round '+h.round+' — 1 point!')
}
function toggleMark(label){
 const c=S.role==='guest'?S.C:null,h=S.H,obs=isObserve(c?.cfg||h?.cfg);
 if(S.markMode==='auto'&&!obs){toast('Switch to Manual or Highlight to tap squares yourself.');return}
 if(c){if(c.phase!=='playing'||label==='FREE'||!c.card.includes(label))return;
  if(!obs&&S.markMode==='highlight'&&!c.called.includes(label)){toast('That square has not been called yet.');return}
  if(c.marked.has(label)){if(!(obs&&S.markMode==='auto'))c.marked.delete(label)}else c.marked.add(label);
  send(S.conn,{type:'mark',label,round:c.round});const good=validWin(c.card,c.marked,c.cfg.size,winPool(c.cfg,c.called));render();
  if(good&&S.markMode!=='manual')toast('🎉 Full line! Press BINGO to claim it.');return;
 }
 if(!h||h.phase!=='playing')return;const p=h.players.get('local');if(!p||label==='FREE'||!p.card.includes(label))return;
 if(!obs&&S.markMode==='highlight'&&!h.called.includes(label)){toast('That square has not been called yet.');return}
 const marked=p.marked.has(label);
 if(marked){if(!(obs&&p.markMode==='auto'))p.marked.delete(label)}else p.marked.add(label);
 if(obs&&!marked)registerSighting(h,label);
 if(h.phase==='playing'&&S.markMode==='auto'&&validWin(p.card,p.marked,h.cfg.size,winPool(h.cfg,h.called))){claimWin(p);return}
 broadcastState();render();const good=validWin(p.card,p.marked,h.cfg.size,winPool(h.cfg,h.called));if(good&&S.markMode!=='manual'&&h.phase==='playing')toast('🎉 Complete line! Press BINGO!')
}
function myClaim(){if(S.role==='guest'){if(!S.C||S.C.phase!=='playing')return;const c=S.C;if(!validWin(c.card,c.marked,c.cfg.size,winPool(c.cfg,c.called))){toast(isObserve(c.cfg)?'Mark every square in a row, column or diagonal when you spot it.':'Only actually called squares count. Finish a full line first.');return}send(S.conn,{type:'claim',round:c.round});toast('Checking your BINGO with the host…')}else{const p=S.H?.players.get('local');if(p)claimWin(p)}}
function callerDelay(cfg){
 const lo=Math.max(3,Math.min(180,Math.round(Number(cfg.minSeconds)||10)));
 const hi=Math.max(lo,Math.min(180,Math.round(Number(cfg.maxSeconds)||lo)));
 return lo+Math.floor(Math.random()*(hi-lo+1));
}
function scheduleAuto(h){S.autoWindow=callerDelay(h.cfg);S.autoDue=Date.now()+S.autoWindow*1000;updateCountdown();}
function startAuto(){
 const h=S.H;if(!h||isObserve(h.cfg)||h.phase!=='playing')return;
 if(!h.cfg.seconds)h.cfg.seconds=Math.max(3,Number(h.cfg.minSeconds)||10);
 stopAuto(false);h.autoActive=true;scheduleAuto(h);
 S.timer=setInterval(()=>{
  if(S.H!==h||h.phase!=='playing'||isObserve(h.cfg)){stopAuto();return;}
  if(Date.now()>=S.autoDue){drawNext(false);if(S.H===h&&h.phase==='playing'&&h.autoActive)scheduleAuto(h)}
  updateCountdown();
 },200);
 broadcastState();updateCountdown();
}
function stopAuto(update=true){if(S.timer){clearInterval(S.timer);S.timer=null}S.autoDue=0;S.autoWindow=0;if(S.H&&update){S.H.autoActive=false;broadcastState()}updateCountdown()}
function updateCountdown(){const el=$('#countdown');if(el){if(S.H?.autoActive&&S.autoDue&&S.H.phase==='playing')el.textContent='Next in '+Math.max(0,Math.ceil((S.autoDue-Date.now())/1000))+'s';else el.textContent=S.H?.cfg.seconds?'Auto paused':''}}
function toggleAuto(){const h=S.H;if(!h||isObserve(h.cfg)||h.phase!=='playing')return;if(h.autoActive)stopAuto();else startAuto();render()}
function saveCallerRange(min,max){
 const lo=Math.max(3,Math.min(180,Math.round(Number(min)||10))),hi=Math.max(lo,Math.min(180,Math.round(Number(max)||lo)));
 S.setup.minSeconds=lo;S.setup.maxSeconds=hi;
 if(S.H){S.H.cfg.minSeconds=lo;S.H.cfg.maxSeconds=hi;if(S.H.autoActive)startAuto()}
 try{localStorage.setItem('callout_caller_range',JSON.stringify([lo,hi]))}catch{}
}
function setTimedCaller(on){
 const h=S.H;S.setup.seconds=on?S.setup.minSeconds:0;
 if(h&&!isObserve(h.cfg)){
  h.cfg.seconds=on?h.cfg.minSeconds:0;
  if(on&&h.phase==='playing')startAuto();else stopAuto();
 }
 try{localStorage.setItem('callout_auto_caller',on?'1':'0')}catch{}
}

function cardHTML(card,marks,called,cfg,clickable){const n=cfg.size,classic=cfg.preset==='classic'&&n===5,obs=isObserve(cfg);const mode=S.markMode;const showWin=S.markMode!=='manual'||!clickable;const line=showWin?winningLine(card,marks,n,winPool(cfg,called)):[];
 const tiles=card.map((label,i)=>{const free=label==='FREE',hit=marks.has(label),available=called.includes(label),showHint=mode==='highlight',won=line.includes(i);return `<button class="bingo-tile ${free?'free':''} ${hit?'marked':''} ${showHint&&available&&!hit?'called':''} ${won?'win-line':''}" data-action="mark" data-label="${encodeURIComponent(label)}" ${!clickable||free||(!obs&&mode==='auto')||(!obs&&mode==='highlight'&&!available)?'disabled':''} title="${esc(label)}" aria-label="${esc(label)}${hit?' marked':''}${showHint&&available?' reported or called':''}" aria-pressed="${hit}"><span>${esc(label)}</span></button>`}).join('');return `${classic?'<div class="colhead">'+[...'BINGO'].map(v=>'<span>'+v+'</span>').join('')+'</div>':''}<div class="bingo-card ${classic?'classic-card':''} size${n}" style="--n:${n}">${tiles}</div>`

function personalPanel(p,called,phase,cfg,winner){const has=!!p?.card?.length,marked=p?.marked||new Set(),mode=S.markMode;const line=has?winningLine(p.card,marked,cfg.size,called):[];const ready=phase==='playing'&&line.length===cfg.size;const complete=winner&&winner===p.id;const best=has?maxProgress(p.card,marked,cfg.size,called):0;return `<div class="pane"><div class="card-header"><h2>🎟️ ${S.role==='solo'?'Your card':'My bingo card'}</h2><span class="chip">${has?marked.size+' marked':'Waiting'}</span></div><div class="mark-mode-box"><label for="markModeCard">Marking assistance</label><select id="markModeCard" aria-label="Choose marking assistance">${markModeOptions(mode)}</select><p class="hint">${mode==='manual'?'No hints: tap any square. Only actually called numbers or prompts count when BINGO is checked.':mode==='highlight'?'Called squares get a gold outline. Tap them yourself to mark them.':'Matches fill automatically, and a complete line wins automatically.'}</p></div>${has?cardHTML(p.card,marked,called,cfg,phase==='playing'):'<div class="notice">Your card appears as soon as the host starts a round.</div>'}${has?`<div class="card-actions"><button class="bingo-btn ${ready&&mode!=='manual'?'ready':''}" data-action="bingo" ${phase!=='playing'?'disabled':''}>${complete?'🏆 BINGO! +1 POINT':ready&&mode!=='manual'?'🎉 BINGO! CLAIM YOUR WIN':'🎉 BINGO!'}</button></div>${complete?'<p class="winning-note">🏆 Verified BINGO! You won this round and earned one point. The winning line is outlined above.</p>':phase==='playing'&&ready&&mode!=='manual'?'<p class="winning-note">✨ Winning line complete! Tap BINGO now to claim your point.</p>':`<p class="statusline">${mode==='manual'?'Manual marking — no match hints. Press BINGO whenever you believe a full row, column or diagonal is complete.':mode==='auto'?'Automatic marking is on. Your first complete line will claim BINGO automatically.':`Best line: ${best} / ${cfg.size} squares. Mark a whole row, column or diagonal, then press BINGO.`}</p>`}`:''}${complete&&S.role!=='solo'?voiceButton():''}</div>`}

function playerArea(p,called,phase,cfg,winner,current,total,sideButton='',isSolo=false){const has=!!p?.card?.length,marks=p?.marked||new Set(),obs=isObserve(cfg),won=winner===p.id&&!!winner;const line=has?winningLine(p.card,marks,cfg.size,winPool(cfg,called)):[];const ready=line.length===cfg.size;const buttonText=won?'🏆 BINGO! +1':phase!=='playing'?'Round complete':ready?'🎉 CLAIM BINGO!':'🎉 BINGO!';const voice=won&&!isSolo;

function gameOverlay(){if(!S.drawer)return '';const panel=S.drawer;const h=S.H,c=S.C;const called=h?.called||c?.called||[];const obs=isObserve(h?.cfg||c?.cfg);const players=h?[...h.players.values()]:c?.players||[];let title='Game tools',body='';if(panel==='settings'){title='⚙ Settings';body=settingsPanel()}else if(panel==='spot'&&obs){title='👀 Log a real sighting';const prompts=h?.prompts||c?.cfg?.prompts||[];const spotted=new Set(called);body=`<p class="spot-help">Only report something that actually happened. You can log an event even if it is not on your own card. This updates the shared hints and helps CPU opponents react to real moments.</p><input id="spotSearch" class="spot-search" placeholder="Find a movie or party event…" aria-label="Search possible sightings"><div class="spot-options">${prompts.map(x=>`<button data-action="reportSighting" data-label="${encodeURIComponent(x)}" class="spot-option ${spotted.has(x)?'reported':''}" ${spotted.has(x)?'disabled':''}>${spotted.has(x)?'✓ ':''}${esc(x)}</button>`).join('')}</div><div class="spot-summary">👀 ${called.length} / ${prompts.length} different events reported</div>`}else if(panel==='scores'){title='🏆 Leaderboard';body=`${miniScores(players)}${h?'<div class="btn-row" style="margin-top:12px"><button class="btn-outline btn-small" data-action="resetScores">Reset scores</button><button class="btn-blue btn-small" data-action="newRound">↻ New round</button></div>':''}`}else if(panel==='calls'){title=obs?'👀 Community sightings':'☷ All calls';body=`<p class="small-muted">${called.length} ${obs?'events reported':'calls so far'}. Latest first.</p>${historyHTML(called)}`}else if(panel==='room'&&h){title='⌗ Invite players';body=`<p class="small-muted">Friends open the same page and enter this room code:</p><div class="room-key">${esc(h.room)}</div><div class="btn-row"><button data-action="copyCode" class="btn-blue btn-small">Copy code</button>${roomUrl()?'<button data-action="copyLink" class="btn-outline btn-small">Copy invite link</button>':''}</div><div class="notice" style="margin-top:14px">TV host must remain open for players to stay connected. New guests can join mid-round.</div>${h.players.has('local')?'<button data-action="openDrawer" data-panel="card" style="margin-top:12px">Open my card</button>':''}`}else if(panel==='card'&&h&&h.players.has('local')){title='My host card';const p=h.players.get('local');body=`${modeSwitch()}<div class="play-card-square">${cardHTML(p.card,p.marked,h.called,h.cfg,h.phase==='playing')}</div><div class="play-actions"><button class="bingo-btn" data-action="bingo" ${h.phase!=='playing'?'disabled':''}>🎉 BINGO!</button></div>${h.winner==='local'?voiceButton():''}`}else{title='? Quick rules';body=`<div class="notice">You win by marking all numbers in <b>any row, column, or diagonal</b> — not the entire card. ${obs?'Observation games rely on players reporting real events (honor system).':'Classic calls are verified against the caller history.'} One point is awarded per round.</div><p><b>✋ Manual</b> — Tap any square; no hints.</p><p><b>✦ Hints</b> — ${obs?'Community sightings glow gold. Tap to mark what you saw.':'Called squares glow gold. Tap to mark them.'}</p><p><b>⚡ Auto</b> — ${obs?'Marks shared sightings automatically; tap any new event to report it.':'Marks numbers and automatically claims a complete line.'}</p><p>Winners can optionally shout BINGO into their microphone for up to 10 seconds.</p><button class="btn-outline" data-action="instructions">Full instructions</button>`}return `<div class="game-overlay" data-overlay="1"><section class="drawer-card" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="drawer-head"><strong>${title}</strong><button data-action="closeDrawer" aria-label="Close panel">✕ Close</button></div><div class="drawer-body">${body}</div></section></div>`}
const RULES=[

let ruleStep=0;
function instructions(){const r=RULES[ruleStep];return `<div class="app-screen rules-screen"><div class="screen-heading"><div><div class="eyebrow">HOW TO PLAY</div><h1>Bingo made easy</h1></div><span class="chip">${ruleStep+1} of ${RULES.length}</span></div><div class="rule-card"><div class="rule-symbol">${r[0]}</div><div class="rule-step">STEP ${String(ruleStep+1).padStart(2,'0')}</div><h2>${r[1]}</h2><p>${r[2]}</p></div><div class="rule-dots">${RULES.map((_,i)=>`<button class="rule-dot ${i===ruleStep?'selected':''}" data-action="ruleStep" data-step="${i}" aria-label="Step ${i+1}"></button>`).join('')}</div><div class="screen-actions"><button class="btn-outline" data-action="${ruleStep?'rulePrev':'back'}">${ruleStep?'← Previous':'← Back'}</button><button class="btn-primary" data-action="${ruleStep===RULES.length-1?'back':'ruleNext'}">${ruleStep===RULES.length-1?'Got it ✓':'Next step →'}</button></div></div>`}

function render(){const inGame=S.page==='game';const previousScroll=window.scrollY;document.body.classList.toggle('tv-mode',S.tv&&S.role==='host'&&inGame);document.body.classList.toggle('in-game',inGame);document.body.classList.toggle('app-mode',!inGame);let content=S.page==='home'?home():S.page==='setupHost'?setup('host'):S.page==='setupSolo'?setup('solo'):S.page==='join'?joinView():S.page==='lobby'?hostLobby():inGame?S.role==='host'?hostGame():S.role==='solo'?soloGame():guestGame():S.page==='instructions'?instructions():home();root.innerHTML=topbar()+`<main>${content}</main>`+gameOverlay();if(S.page==='lobby')setTimeout(renderQR,0);if(S.role==='host'||S.role==='solo')updateCountdown();if(S.voiceStream&&$('#voiceTime'))$('#voiceTime').textContent=Math.ceil(Math.max(0,S.voiceEnd-Date.now())/1000)+'s';if(!inGame)window.scrollTo(0,0)}

function celebrate(){for(let i=0;i<60;i++){const div=document.createElement('div');div.className='confetti';div.style.left=Math.random()*100+'vw';div.style.background=['#54e1bb','#ffbd72','#ff6c86','#83b8ff','#f5f7ff'][i%5];div.style.animationDuration=(2+Math.random()*2.4)+'s';div.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(div);setTimeout(()=>div.remove(),5000)}}
function issueVoicePermission(p){const h=S.H;if(!h||h.voiceStarted||h.winner!==p.id)return;h.voiceStarted=true;h.voiceToken=uid()+uid();h.voiceId=p.id;const list=[...h.players.values()].filter(q=>q.kind==='remote'&&q.connected&&q.id!==p.id).map(q=>q.id);list.push(S.peer.id);S.voiceGate={token:h.voiceToken,speakerPeer:p.id,until:Date.now()+15000};for(const q of h.players.values())if(q.conn&&q.id!==p.id)send(q.conn,{type:'voiceNotice',token:h.voiceToken,peer:p.id,name:p.name});send(p.conn,{type:'voiceGo',token:h.voiceToken,peers:list,ms:10000});setTimeout(()=>{if(S.H===h){for(const q of h.players.values())if(q.conn)send(q.conn,{type:'voiceEnd'});S.voiceGate=null;stopRemoteAudio()}},11500)}
async function speak(){const c=S.C,h=S.H;const guestWinner=S.role==='guest'&&c&&c.winner===c.playerId;const hostWinner=S.role==='host'&&h&&h.winner==='local';if((!guestWinner&&!hostWinner)||S.voiceUsed)return;if(!navigator.mediaDevices?.getUserMedia){showError('Microphone unavailable. Open the page over HTTPS in a modern browser.');return}S.voiceUsed=true;render();try{S.voiceStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});if(hostWinner){if(!S.peer||!h||h.voiceStarted){stopSpeaking();return}h.voiceStarted=true;h.voiceToken=uid()+uid();h.voiceId='local';const listeners=[...h.players.values()].filter(q=>q.kind==='remote'&&q.connected&&q.conn?.open);for(const q of listeners)send(q.conn,{type:'voiceNotice',token:h.voiceToken,peer:S.peer.id,name:h.players.get('local')?.name||'Host'});launchVoice(listeners.map(p=>p.id),h.voiceToken,10000);setTimeout(()=>{if(S.H===h){for(const q of h.players.values())if(q.conn)send(q.conn,{type:'voiceEnd'})}},10500)}else{if(!S.conn?.open){stopSpeaking();showError('Not connected to the host.');return}send(S.conn,{type:'voiceRequest'});toast('Microphone ready — waiting for other players…')}}catch(e){S.voiceUsed=false;S.voiceStream=null;render();showError('Microphone permission denied or unavailable: '+e.message)}}
function launchVoice(peers,token,ms){if(!S.voiceStream||!S.peer)return;S.voiceEnd=Date.now()+Math.min(10000,ms);S.voiceCalls=[];for(const id of [...new Set(peers)]){if(id===S.peer.id)continue;try{const call=S.peer.call(id,S.voiceStream,{metadata:{kind:'bingoVoice',token}});if(call){S.voiceCalls.push(call);call.on('error',()=>{})}}catch(e){console.warn('Audio connection',e)}}S.voiceTimer=setInterval(()=>{const left=Math.max(0,S.voiceEnd-Date.now());const el=$('#voiceTime');if(el)el.textContent=Math.ceil(left/1000)+'s';if(left<=0)stopSpeaking()},140);render();toast('🔴 LIVE! Shout BINGO — mic closes in 10 seconds')}
function receiveCall(call){const gate=S.voiceGate;const meta=call.metadata;if(!gate||!meta||meta.kind!=='bingoVoice'||meta.token!==gate.token||call.peer!==gate.speakerPeer||Date.now()>gate.until){call.close();return}try{call.answer();call.on('stream',stream=>{let a=document.createElement('audio');a.autoplay=true;a.playsInline=true;a.srcObject=stream;a.style.display='none';document.body.appendChild(a);S.activeAudio.push({a,call});a.play().catch(()=>toast('Voice blocked by browser — tap Enable audio to allow playback.'));toast('🎙️ Bingo shout is live!');setTimeout(()=>{try{call.close()}catch{}cleanupAudio(a)},10500)});call.on('close',()=>{for(const x of S.activeAudio.filter(x=>x.call===call))cleanupAudio(x.a)});call.on('error',()=>{})}catch(e){console.warn('Answer audio',e)}}
function cleanupAudio(a){try{a.pause();a.srcObject=null;a.remove()}catch{}S.activeAudio=S.activeAudio.filter(x=>x.a!==a)}
function stopRemoteAudio(){for(const x of [...S.activeAudio]){try{x.call.close()}catch{}cleanupAudio(x.a)}}
function stopSpeaking(){if(S.voiceTimer)clearInterval(S.voiceTimer);S.voiceTimer=null;for(const call of S.voiceCalls)try{call.close()}catch{}S.voiceCalls=[];if(S.voiceStream){for(const track of S.voiceStream.getTracks())track.stop();S.voiceStream=null}S.voiceEnd=0;if(S.page==='game')render()}
function closeNetwork(reset=true){stopSpeaking();stopRemoteAudio();if(S.timer){clearInterval(S.timer);S.timer=null}if(S.peer)try{S.peer.destroy()}catch{}S.peer=null;S.conn=null;S.conns=new Map();S.voiceGate=null;if(S.H)S.H.cfg.readAloud=false;window.CalloutVoice?.stop();window.CalloutVoice?.setEnabled(false);if(reset){S.H=null;S.C=null;S.role='';S.status='';S.tv=false}}

let returnPage='home';
root.addEventListener('click',async ev=>{const b=ev.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;const go=page=>{S.page=page;S.drawer='';render();window.scrollTo(0,0)};if(act==='configTab'){const tab=b.dataset.tab||'rules';S.setupTab=tab;const page=root.querySelector('.config-page');if(page){page.dataset.tab=tab;root.querySelectorAll('.config-tabs button').forEach(x=>x.classList.toggle('selected',x.dataset.tab===tab))}}else if(act==='ruleNext'){ruleStep=Math.min(RULES.length-1,ruleStep+1);render()}else if(act==='rulePrev'){ruleStep=Math.max(0,ruleStep-1);render()}else if(act==='ruleStep'){ruleStep=Math.max(0,Math.min(RULES.length-1,Number(b.dataset.step)||0));render()}else if(act==='choosePreset'){const name=b.dataset.preset;if(PRESETS[name]){S.setup.preset=name;S.setup.calls=PRESETS[name].join('\n');const sel=$('#preset'),box=$('#callList'),count=$('#callCount');if(sel)sel.value=name;if(box)box.value=S.setup.calls;if(count)count.textContent=PRESETS[name].length;if($('#markModeSetup'))$('#markModeSetup').innerHTML=markModeOptions(S.markMode,name!=='classic');if($('#customFlowField'))$('#customFlowField').style.display=name==='custom'?'flex':'none';root.querySelectorAll('[data-action=choosePreset]').forEach(x=>x.classList.toggle('active',x.dataset.preset===name));root.querySelector('[data-action=viewPresets]')?.classList.remove('active');toast(name==='classic'?'Classic 1–75 Bingo selected':'Party Bingo selected')}}else if(act==='viewPresets'){const page=root.querySelector('.config-page');if(page){page.dataset.tab='calls';root.querySelectorAll('.config-tabs button').forEach(x=>x.classList.toggle('selected',x.dataset.tab==='calls'))}$('#preset')?.focus()}else if(act==='openDrawer'){if(S.page==='setupSolo'||S.page==='setupHost')collectSetup();S.drawer=b.dataset.panel||'rules';render()}else if(act==='closeDrawer'){S.drawer='';render()}else if(act==='setMarkQuick'){setMarkMode(b.dataset.mode)}else if(act==='leave'){ev.preventDefault();if(S.role&& !confirmAction('Leave the game? If you are hosting, the room will close for everybody.'))return;closeNetwork();go('home')}else if(act==='instructions'){returnPage=S.page;ruleStep=0;go('instructions')}else if(act==='back'){go(returnPage==='instructions'?'home':returnPage)}else if(act==='setupHost'){S.role='';go('setupHost')}else if(act==='setupSolo'){S.role='';go('setupSolo')}else if(act==='setupJoin'){S.role='';go('join')}else if(act==='createSolo'){collectSetup();unlockAudio(true);if(createH('solo'))window.scrollTo(0,0)}else if(act==='createHost'){unlockAudio(true);newHroom();window.scrollTo(0,0)}else if(act==='join'){unlockAudio(true);startGuest();window.scrollTo(0,0)}else if(act==='next'){drawNext()}else if(act==='begin'||act==='newRound'){if(act==='newRound'&&!confirmAction('Start a fresh round with new cards? Existing scores stay.'))return;beginRound();go('game')}else if(act==='toggleAuto'){toggleAuto()}else if(act==='bingo'){myClaim()}else if(act==='mark'){toggleMark(decodeURIComponent(b.dataset.label||''))}else if(act==='reportSighting'){const label=decodeURIComponent(b.dataset.label||'');const h=S.H,c=S.C;if(S.role==='guest'&&c&&isObserve(c.cfg)&&c.phase==='playing'){send(S.conn,{type:'sighting',label,round:c.round});toast('Reported: '+label)}else if(h&&isObserve(h.cfg)&&h.phase==='playing'){registerSighting(h,label);broadcastState();render()}}else if(act==='tv'){S.tv=!S.tv;render();if(S.tv&&document.fullscreenEnabled&&!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{})}else if(!S.tv&&document.fullscreenElement){document.exitFullscreen().catch(()=>{})}}else if(act==='lobby'){go('lobby')}else if(act==='returnGame'){go('game')}else if(act==='resetScores'){if(!confirmAction('Reset everybody\'s score to zero?'))return;for(const p of S.H?.players.values()||[])p.score=0;broadcastState();render()}else if(act==='copyCode'){try{await navigator.clipboard.writeText(S.H.room);toast('Room code copied')}catch{toast('Room code: '+S.H.room)}}else if(act==='copyLink'){try{await navigator.clipboard.writeText(roomUrl());toast('Invite link copied')}catch{toast(roomUrl())}}else if(act==='sound'){setSound(!S.soundOn);render()}else if(act==='loadVoice'||act==='testVoice'){unlockAudio(true);if(S.H)S.H.cfg.readAloud=true;S.setup.readAloud=true;try{localStorage.setItem('callout_voice_on','1')}catch{};const v=window.CalloutVoice;if(!v){toast('Voice is loading…');return}v.setEnabled(true);(act==='testVoice'?v.test():v.prepare()).catch(e=>showError('Supertonic: '+e.message));render()}else if(act==='toggleVoice'){const h=S.H;const value=!(h?h.cfg.readAloud:S.setup.readAloud);S.setup.readAloud=value;if(h)h.cfg.readAloud=value;try{localStorage.setItem('callout_voice_on',value?'1':'0')}catch{};window.CalloutVoice?.setEnabled(value);if(value){unlockAudio(true);window.CalloutVoice?.prepare().catch(e=>showError(e.message))}render()}else if(act==='lastVoice'){const h=S.H;if(h?.cfg.readAloud){const last=h.called.at(-1);if(last)window.CalloutVoice?.announce(isObserve(h.cfg)?'Spotted: '+last:spokenCaller(last));else toast('No calls yet.')}else toast('Enable caller voice first.')}else if(act==='speak'){speak()}else if(act==='stopSpeaking'){stopSpeaking()}else if(act==='shuffleList'){const t=$('#callList');t.value=shuffle(parseCalls(t.value)).join('\n');S.setup.calls=t.value;$('#callCount').textContent=parseCalls(t.value).length}else if(act==='clearList'){if(confirmAction('Clear all calls?')){$('#callList').value='';S.setup.calls='';$('#callCount').textContent='0'}}else if(act==='exportCalls'){exportCalls()}else if(act==='importCalls'){$('#importFile')?.click()}});
document.addEventListener('click',e=>{if(e.target.classList?.contains('game-overlay')){S.drawer='';render()}});
document.addEventListener('callout-voice-state',e=>{const el=$('#supertonicStatus');if(el)el.textContent=e.detail.message;if(S.H?.cfg.readAloud&&!e.detail.enabled&&window.CalloutVoice)window.CalloutVoice.prepare().catch(()=>{});});
root.addEventListener('change',e=>{if(e.target.id==='soundSetting'){setSound(e.target.checked);render();return}if(e.target.id==='autoCallerSetting'){setTimedCaller(e.target.checked);render();return}if(e.target.id==='autoMin'||e.target.id==='autoMax'){saveCallerRange($('#autoMin')?.value,$('#autoMax')?.value);render();return}if(e.target.id==='supertonicVoice'){window.CalloutVoice?.setVoice(e.target.value);return}if(e.target.id==='markModeCard'||e.target.id==='markModeSetup'){setMarkMode(e.target.value,e.target.id==='markModeCard')}else if(e.target.id==='preset'){const v=e.target.value;if(v!=='custom'){const t=$('#callList');t.value=PRESETS[v].join('\n');S.setup.calls=t.value;$('#callCount').textContent=parseCalls(t.value).length}S.setup.preset=v;if($('#markModeSetup'))$('#markModeSetup').innerHTML=markModeOptions(S.markMode,v!=='classic');if($('#customFlowField'))$('#customFlowField').style.display=v==='custom'?'flex':'none';root.querySelectorAll('[data-action=choosePreset]').forEach(b=>b.classList.toggle('active',b.dataset.preset===v));root.querySelector('[data-action=viewPresets]')?.classList.toggle('active',!['classic','party'].includes(v))}else if(e.target.id==='importFile'){const file=e.target.files?.[0];if(file){file.text().then(t=>{const box=$('#callList');if(box){box.value=t;S.setup.preset='custom';$('#preset').value='custom';if($('#customFlowField'))$('#customFlowField').style.display='flex';$('#callCount').textContent=parseCalls(t).length}}).catch(err=>showError(err.message))}}});
root.addEventListener('input',e=>{if(e.target.id==='spotSearch'){const term=e.target.value.toLocaleLowerCase().trim();for(const x of root.querySelectorAll('.spot-option'))x.hidden=!decodeURIComponent(x.dataset.label||'').toLocaleLowerCase().includes(term);return}if(e.target.id==='callList'){S.setup.calls=e.target.value;S.setup.preset='custom';if($('#customFlowField'))$('#customFlowField').style.display='flex';const p=$('#preset');if(p)p.value='custom';const n=$('#callCount');if(n)n.textContent=parseCalls(e.target.value).length}else if(e.target.id==='joinCode'){e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'')}else if(e.target.id==='size'){const x=$('#callCount');if(x)x.textContent=parseCalls($('#callList').value).length}});
window.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.drawer){S.drawer='';render();return}if(ev.key==='Escape'&&S.tv){S.tv=false;render()}if((ev.key===' '||ev.key.toLowerCase()==='n')&&!ev.repeat&&(S.role==='host'||S.role==='solo')&&S.page==='game'&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement?.tagName)){ev.preventDefault();if(!isObserve(S.H?.cfg))drawNext()}});
window.addEventListener('beforeunload',()=>closeNetwork());
if(S.autoJoin){S.page='join'}render();
})();
</script>
</body>
</html>
